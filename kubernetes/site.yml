---
# HA Kubernetes (kubeadm) on the libvirt lab VMs.
# Idempotent: re-running skips nodes that are already initialized/joined.
#
#   make run VENDOR=kubernetes            # full deploy
#   make run VENDOR=kubernetes ARGS="--tags prep"

# ------------------------------------------------------------------ 0. clone fix-up
- name: Give cloned VMs unique identities
  hosts: k8s
  tags: [identity]
  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Write /etc/hosts
      ansible.builtin.template:
        src: templates/hosts.j2
        dest: /etc/hosts
        mode: "0644"

    - name: Check identity marker
      ansible.builtin.stat:
        path: /etc/k8s-node-identity-regenerated
      register: identity_marker

    - name: Regenerate machine-id and SSH host keys (once)
      when: not identity_marker.stat.exists
      block:
        - name: Reset machine-id
          ansible.builtin.shell: |
            set -e
            rm -f /etc/machine-id /var/lib/dbus/machine-id
            systemd-machine-id-setup
            if [ -d /var/lib/dbus ]; then ln -sf /etc/machine-id /var/lib/dbus/machine-id; fi
          changed_when: true

        - name: Regenerate SSH host keys
          ansible.builtin.shell: |
            set -e
            rm -f /etc/ssh/ssh_host_*
            ssh-keygen -A
          changed_when: true

        - name: Drop marker
          ansible.builtin.copy:
            dest: /etc/k8s-node-identity-regenerated
            content: "regenerated by ansible\n"
            mode: "0644"

        - name: Reboot to pick up new identity
          ansible.builtin.reboot:
            reboot_timeout: 300

    - name: Collect machine-id and product_uuid
      ansible.builtin.shell: cat /etc/machine-id /sys/class/dmi/id/product_uuid
      register: node_ids
      changed_when: false

    - name: Assert machine-id and product_uuid are unique across nodes
      run_once: true
      ansible.builtin.assert:
        that:
          - ids | unique | length == ids | length
        fail_msg: "Duplicate machine-id/product_uuid: {{ ids }}"
      vars:
        ids: "{{ groups['k8s'] | map('extract', hostvars, ['node_ids', 'stdout_lines']) | flatten }}"

# ------------------------------------------------------------------ 1. node prep
- name: Prepare all nodes (swap, kernel, containerd, kubeadm)
  hosts: k8s
  tags: [prep]
  tasks:
    - name: Disable swap now
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0

    - name: Disable swap in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Kernel modules on boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: "overlay\nbr_netfilter\n"
        mode: "0644"

    - name: Load kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [overlay, br_netfilter]

    - name: Kubernetes sysctls
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-k8s.conf
        reload: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward

    - name: Disable ufw (lab cluster on isolated NAT network)
      ansible.builtin.systemd:
        name: ufw
        state: stopped
        enabled: false
      failed_when: false

    - name: Base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, gpg, apt-transport-https, conntrack, socat, chrony]
        state: present
        update_cache: true

    - name: Keyrings dir
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Docker apt key (for containerd.io 2.x)
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Docker apt repo
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Kubernetes apt key
      ansible.builtin.shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key \
          | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Kubernetes apt repo
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install containerd and Kubernetes packages
      ansible.builtin.apt:
        name:
          - containerd.io
          - "kubelet={{ k8s_version }}-*"
          - "kubeadm={{ k8s_version }}-*"
          - "kubectl={{ k8s_version }}-*"
        state: present
        update_cache: true
        allow_change_held_packages: true

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl, containerd.io]

    - name: Check containerd config
      ansible.builtin.command: grep -q 'SystemdCgroup = true' /etc/containerd/config.toml
      register: cgroup_ok
      changed_when: false
      failed_when: false

    - name: Write default containerd config with systemd cgroups
      ansible.builtin.shell: |
        set -e
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        grep -q 'SystemdCgroup = true' /etc/containerd/config.toml
      when: cgroup_ok.rc != 0
      register: containerd_cfg

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true
      when: containerd_cfg is changed

    - name: crictl endpoint
      ansible.builtin.copy:
        dest: /etc/crictl.yaml
        content: "runtime-endpoint: unix:///run/containerd/containerd.sock\nimage-endpoint: unix:///run/containerd/containerd.sock\n"
        mode: "0644"

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

    - name: Enable chrony
      ansible.builtin.systemd:
        name: chrony
        state: started
        enabled: true

# ------------------------------------------------------------------ 2. kube-vip
- name: kube-vip static pod on masters
  hosts: k8s_masters
  tags: [kubevip]
  tasks:
    - name: Check for existing kube-vip manifest
      ansible.builtin.stat:
        path: /etc/kubernetes/manifests/kube-vip.yaml
      register: kv

    - name: Generate kube-vip manifest
      when: not kv.stat.exists
      ansible.builtin.shell: |
        set -e
        mkdir -p /etc/kubernetes/manifests
        ctr image pull ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
        ctr run --rm --net-host ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }} kvgen \
          /kube-vip manifest pod \
            --interface {{ ansible_default_ipv4.interface }} \
            --address {{ k8s_api_vip }} \
            --controlplane --arp --leaderElection \
          > /etc/kubernetes/manifests/kube-vip.yaml

# ------------------------------------------------------------------ 3. first master
- name: Initialize first control-plane node
  hosts: "{{ groups['k8s_masters'][0] }}"
  tags: [init]
  vars:
    admin_conf: /etc/kubernetes/admin.conf
  tasks:
    - name: Check if already initialized
      ansible.builtin.stat:
        path: "{{ admin_conf }}"
      register: initialized

    - name: kubeadm init
      when: not initialized.stat.exists
      block:
        - name: Generate certificate key
          ansible.builtin.command: kubeadm certs certificate-key
          register: cert_key

        - name: Render kubeadm config
          ansible.builtin.template:
            src: templates/kubeadm-init.yaml.j2
            dest: /root/kubeadm-init.yaml
            mode: "0600"
          vars:
            k8s_cert_key: "{{ cert_key.stdout }}"

        # Since 1.29 admin.conf has no rights until the cluster is up,
        # so kube-vip must use super-admin.conf during bootstrap.
        - name: Point kube-vip at super-admin.conf for bootstrap
          ansible.builtin.replace:
            path: /etc/kubernetes/manifests/kube-vip.yaml
            regexp: 'path: /etc/kubernetes/admin.conf'
            replace: 'path: /etc/kubernetes/super-admin.conf'

        - name: Run kubeadm init
          ansible.builtin.command: kubeadm init --config /root/kubeadm-init.yaml --upload-certs
          register: kinit

        - name: Save init log
          ansible.builtin.copy:
            dest: /root/kubeadm-init.log
            content: "{{ kinit.stdout }}"
            mode: "0600"

        - name: Point kube-vip back at admin.conf
          ansible.builtin.replace:
            path: /etc/kubernetes/manifests/kube-vip.yaml
            regexp: 'path: /etc/kubernetes/super-admin.conf'
            replace: 'path: /etc/kubernetes/admin.conf'

    - name: Wait for API on the VIP
      ansible.builtin.uri:
        url: "https://{{ k8s_api_vip }}:{{ k8s_api_port }}/livez"
        validate_certs: false
        status_code: [200, 401, 403]
      register: api
      until: api.status in [200, 401, 403]
      retries: 60
      delay: 5

    - name: Ensure ~/.kube exists then copy kubeconfig
      ansible.builtin.shell: |
        u={{ ansible_user | default('vivekmuralee') }}
        install -d -o $u -g $u -m 0700 /home/$u/.kube
        install -o $u -g $u -m 0600 {{ admin_conf }} /home/$u/.kube/config
      changed_when: false

    - name: Fetch kubeconfig to the workstation
      ansible.builtin.fetch:
        src: "{{ admin_conf }}"
        dest: "{{ playbook_dir }}/artifacts/kubeconfig"
        flat: true

    - name: Create worker join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: Upload certs for control-plane join
      ansible.builtin.shell: kubeadm init phase upload-certs --upload-certs | tail -1
      register: join_cert_key
      changed_when: false

    - name: Share join info
      ansible.builtin.set_fact:
        k8s_join_cmd: "{{ join_cmd.stdout }}"
        k8s_join_cert_key: "{{ join_cert_key.stdout }}"

# ------------------------------------------------------------------ 4. other masters
- name: Join remaining control-plane nodes
  hosts: "k8s_masters:!{{ groups['k8s_masters'][0] }}"
  tags: [join]
  serial: 1
  tasks:
    - name: Check if already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: joined

    - name: kubeadm join --control-plane
      when: not joined.stat.exists
      ansible.builtin.command: >
        {{ hostvars[k8s_first_master].k8s_join_cmd }}
        --control-plane
        --certificate-key {{ hostvars[k8s_first_master].k8s_join_cert_key }}
        --apiserver-advertise-address {{ ansible_host }}
        --node-name {{ inventory_hostname }}

    - name: kubeconfig for user
      ansible.builtin.shell: |
        u={{ ansible_user | default('vivekmuralee') }}
        install -d -o $u -g $u -m 0700 /home/$u/.kube
        install -o $u -g $u -m 0600 /etc/kubernetes/admin.conf /home/$u/.kube/config
      changed_when: false

# ------------------------------------------------------------------ 5. workers
- name: Join workers
  hosts: k8s_workers
  tags: [join]
  tasks:
    - name: Check if already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: joined

    - name: kubeadm join
      when: not joined.stat.exists
      ansible.builtin.command: >
        {{ hostvars[k8s_first_master].k8s_join_cmd }}
        --node-name {{ inventory_hostname }}

# ------------------------------------------------------------------ 6. CNI + checks
- name: Install Calico and verify
  hosts: "{{ groups['k8s_masters'][0] }}"
  tags: [cni]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Check for Calico Installation
      ansible.builtin.command: kubectl get installations.operator.tigera.io default
      register: calico_inst
      changed_when: false
      failed_when: false

    # Calico >= 3.30 ships the operator CRDs in a separate manifest. That file also
    # carries the legacy crd.projectcalico.org/v1 CRDs; if they exist the operator
    # falls back to v1 mode (extra calico-apiserver, "waiting for enabled IP pools").
    # Apply only operator.tigera.io + policy CRDs and let the operator install the
    # native projectcalico.org/v3 CRDs itself.
    - name: Install Calico (operator CRDs + operator + Installation)
      when: calico_inst.rc != 0
      ansible.builtin.shell: |
        set -e
        base=https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests
        curl -fsSL $base/operator-crds.yaml \
          | awk 'BEGIN{RS="\n---\n"; ORS="\n---\n"} !/\n  name: [a-z0-9]+\.crd\.projectcalico\.org\n/' \
          > /root/calico-operator-crds.yaml
        ! grep -q '\.crd\.projectcalico\.org$' /root/calico-operator-crds.yaml
        kubectl apply --server-side --force-conflicts -f /root/calico-operator-crds.yaml
        kubectl wait --for condition=established --timeout=60s crd/installations.operator.tigera.io
        kubectl apply --server-side --force-conflicts -f $base/tigera-operator.yaml
        kubectl -n tigera-operator rollout status deploy/tigera-operator --timeout=180s
        curl -fsSL $base/custom-resources.yaml \
          | sed 's#cidr: 192.168.0.0/16#cidr: {{ k8s_pod_cidr }}#' > /root/calico-custom-resources.yaml
        grep -q 'cidr: {{ k8s_pod_cidr }}' /root/calico-custom-resources.yaml
        kubectl apply --server-side -f /root/calico-custom-resources.yaml

    - name: Assert operator runs in projectcalico.org/v3 mode (no legacy v1 CRDs)
      ansible.builtin.shell: "! kubectl get crd -o name | grep -q '\\.crd\\.projectcalico\\.org$'"
      changed_when: false

    - name: Wait for nodes Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=600s
      changed_when: false

    - name: Label workers
      ansible.builtin.command: kubectl label node {{ item }} node-role.kubernetes.io/worker= --overwrite
      loop: "{{ groups['k8s_workers'] }}"
      changed_when: false

    - name: Cluster state
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Show nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines

# ------------------------------------------------------------------ 7. MetalLB
- name: Install MetalLB (L2) for LoadBalancer services
  hosts: "{{ groups['k8s_masters'][0] }}"
  tags: [metallb]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Apply MetalLB manifest
      ansible.builtin.command: >
        kubectl apply --server-side --force-conflicts
        -f https://raw.githubusercontent.com/metallb/metallb/{{ metallb_version }}/config/manifests/metallb-native.yaml
      register: mlb
      changed_when: "'serverside-applied' in mlb.stdout and 'unchanged' not in mlb.stdout"

    - name: Wait for MetalLB controller and speakers
      ansible.builtin.shell: |
        set -e
        kubectl -n metallb-system rollout status deploy/controller --timeout=300s
        kubectl -n metallb-system rollout status ds/speaker --timeout=300s
      changed_when: false

    - name: Render address pool
      ansible.builtin.template:
        src: templates/metallb-pool.yaml.j2
        dest: /root/metallb-pool.yaml
        mode: "0644"

    # The validating webhook can take a few seconds after rollout to accept requests.
    - name: Apply IPAddressPool and L2Advertisement
      ansible.builtin.command: kubectl apply -f /root/metallb-pool.yaml
      register: pool
      retries: 12
      delay: 5
      until: pool.rc == 0
      changed_when: "'created' in pool.stdout or 'configured' in pool.stdout"

# ------------------------------------------------------------------ 8. kubelet reservations
- name: Kubelet system/kube reservations and eviction thresholds
  hosts: k8s
  tags: [kubelet]
  serial: 1                       # restart kubelet one node at a time
  tasks:
    - name: Drop-in config dir
      ansible.builtin.file:
        path: "{{ kubelet_config_dir }}"
        state: directory
        mode: "0755"

    - name: Reservation drop-in
      ansible.builtin.template:
        src: templates/kubelet-reservations.conf.j2
        dest: "{{ kubelet_config_dir }}/50-reservations.conf"
        mode: "0644"
      register: kres

    - name: Point kubelet at the drop-in dir
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        content: "KUBELET_EXTRA_ARGS=--config-dir={{ kubelet_config_dir }}\n"
        mode: "0644"
      register: kargs

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
      when: kres is changed or kargs is changed

    # Kubelet serving certs are not auto-approved by kube-controller-manager.
    # Approve only kubelet-serving CSRs requested by this node's own identity.
    - name: Approve this node's kubelet serving CSR
      delegate_to: "{{ k8s_first_master }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      ansible.builtin.shell: |
        set -e
        node=system:node:{{ inventory_hostname }}
        for i in $(seq 1 30); do
          if kubectl get csr -o jsonpath='{range .items[?(@.spec.signerName=="kubernetes.io/kubelet-serving")]}{.spec.username}{" "}{.status.certificate}{"\n"}{end}' \
               | awk -v n="$node" '$1==n && $2!=""' | grep -q .; then
            echo already-issued; exit 0; fi
          pending=$(kubectl get csr -o jsonpath='{range .items[?(@.spec.signerName=="kubernetes.io/kubelet-serving")]}{.metadata.name}{" "}{.spec.username}{" "}{.status.conditions}{"\n"}{end}' \
               | awk -v n="$node" '$2==n && $3=="" {print $1}')
          if [ -n "$pending" ]; then kubectl certificate approve $pending; exit 0; fi
          sleep 2
        done
        echo "no kubelet-serving CSR from $node" >&2; exit 1
      register: csr
      changed_when: "'approved' in csr.stdout"
      when: kres is changed or kargs is changed

    - name: Wait for node Ready with new allocatable
      delegate_to: "{{ k8s_first_master }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      ansible.builtin.command: kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=180s
      changed_when: false

# ------------------------------------------------------------------ 9. metrics-server
- name: Install metrics-server
  hosts: "{{ groups['k8s_masters'][0] }}"
  tags: [metrics]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Apply metrics-server (HA)
      ansible.builtin.command: >
        kubectl apply --server-side --force-conflicts
        -f https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/high-availability-1.21%2B.yaml
      register: ms
      changed_when: "'unchanged' not in ms.stdout"

    # Covers kubelet serving-cert renewals: approve pending kubelet-serving CSRs,
    # but only those whose requester is one of our inventory nodes.
    - name: Approve pending kubelet serving CSRs from inventory nodes
      ansible.builtin.shell: |
        nodes="{{ groups['k8s'] | map('regex_replace', '^', 'system:node:') | join(' ') }}"
        kubectl get csr -o jsonpath='{range .items[?(@.spec.signerName=="kubernetes.io/kubelet-serving")]}{.metadata.name}{" "}{.spec.username}{" "}{.status.conditions}{"\n"}{end}' \
          | awk -v nodes="$nodes" 'BEGIN{split(nodes,a," "); for(i in a) ok[a[i]]=1} $3=="" && ok[$2] {print $1}' \
          | xargs -r kubectl certificate approve
      register: renew
      changed_when: "'approved' in renew.stdout"

    - name: Wait for metrics-server
      ansible.builtin.command: kubectl -n kube-system rollout status deploy/metrics-server --timeout=300s
      changed_when: false

    - name: Wait for metrics API
      ansible.builtin.command: kubectl top nodes
      register: top
      retries: 24
      delay: 5
      until: top.rc == 0
      changed_when: false

    - name: Show node usage
      ansible.builtin.debug:
        var: top.stdout_lines

# ------------------------------------------------------------------ 10. disk
- name: Grow root filesystem into free VG space
  hosts: k8s
  tags: [disk]
  tasks:
    - name: Free extents in the root VG
      ansible.builtin.shell: vgs --noheadings -o vg_free_count "$(lvs --noheadings -o vg_name {{ root_lv }} | xargs)" | xargs
      register: vg_free
      changed_when: false

    - name: Extend root LV and filesystem (online)
      ansible.builtin.command: lvextend -r -l +100%FREE {{ root_lv }}
      when: vg_free.stdout | int > 0

# ------------------------------------------------------------------ 11. control-plane metrics
- name: Expose control-plane metrics endpoints for Prometheus
  hosts: k8s_masters
  tags: [cpmetrics]
  serial: 1                       # static pods restart one master at a time
  tasks:
    - name: controller-manager and scheduler listen on all interfaces (HTTPS, authn/authz)
      ansible.builtin.replace:
        path: "/etc/kubernetes/manifests/{{ item }}.yaml"
        regexp: '--bind-address=127\.0\.0\.1'
        replace: '--bind-address=0.0.0.0'
      loop: [kube-controller-manager, kube-scheduler]
      register: cp_bind

    - name: etcd metrics (metrics only, no data) on all interfaces
      ansible.builtin.replace:
        path: /etc/kubernetes/manifests/etcd.yaml
        regexp: '--listen-metrics-urls=http://127\.0\.0\.1:2381$'
        replace: '--listen-metrics-urls=http://0.0.0.0:2381'
      register: etcd_bind

    - name: Wait for control-plane pods on this master
      when: cp_bind is changed or etcd_bind is changed
      delegate_to: "{{ k8s_first_master }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      ansible.builtin.shell: |
        set -e
        sleep 20
        for c in etcd kube-controller-manager kube-scheduler kube-apiserver; do
          kubectl -n kube-system wait --for=condition=Ready pod/$c-{{ inventory_hostname }} --timeout=180s
        done
      changed_when: false

    - name: Metrics endpoints answer on the node IP
      ansible.builtin.shell: |
        set -e
        curl -fsS http://{{ ansible_host }}:2381/metrics >/dev/null
        curl -sk -o /dev/null -w '%{http_code}' https://{{ ansible_host }}:10257/metrics | grep -qE '^(200|401|403)$'
        curl -sk -o /dev/null -w '%{http_code}' https://{{ ansible_host }}:10259/metrics | grep -qE '^(200|401|403)$'
      retries: 12
      delay: 5
      register: ep
      until: ep.rc == 0
      changed_when: false

- name: Persist control-plane metrics settings in kubeadm config and kube-proxy
  hosts: "{{ groups['k8s_masters'][0] }}"
  tags: [cpmetrics]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    # So 'kubeadm upgrade' regenerates the static pods with the same settings.
    - name: Patch ClusterConfiguration in kubeadm-config
      ansible.builtin.shell: |
        set -e
        kubectl -n kube-system get cm kubeadm-config -o jsonpath='{.data.ClusterConfiguration}' > /root/cc.yaml
        python3 - <<'PY'
        import yaml
        p = '/root/cc.yaml'
        c = yaml.safe_load(open(p))
        def setarg(sec, name, value):
            args = sec.setdefault('extraArgs', [])
            args[:] = [a for a in args if a.get('name') != name]
            args.append({'name': name, 'value': value})
        setarg(c.setdefault('controllerManager', {}) or c['controllerManager'], 'bind-address', '0.0.0.0')
        setarg(c.setdefault('scheduler', {}) or c['scheduler'], 'bind-address', '0.0.0.0')
        setarg(c.setdefault('etcd', {}).setdefault('local', {}), 'listen-metrics-urls', 'http://0.0.0.0:2381')
        new = yaml.safe_dump(c, sort_keys=False)
        old = open(p).read()
        open(p, 'w').write(new)
        print('changed' if yaml.safe_load(old) != c else 'unchanged')
        PY
      register: ccpatch
      changed_when: false

    - name: Apply patched kubeadm-config
      ansible.builtin.shell: |
        kubectl -n kube-system create cm kubeadm-config --from-file=ClusterConfiguration=/root/cc.yaml \
          --dry-run=client -o yaml | kubectl apply --server-side --force-conflicts -f -
      register: ccapply
      changed_when: "'serverside-applied' in ccapply.stdout"

    - name: kube-proxy metrics on all interfaces
      ansible.builtin.shell: |
        set -e
        cur=$(kubectl -n kube-system get cm kube-proxy -o jsonpath='{.data.config\.conf}' | awk '/^metricsBindAddress:/{print $2}')
        if [ "$cur" != "0.0.0.0:10249" ]; then
          kubectl -n kube-system get cm kube-proxy -o yaml \
            | sed -E 's/^(\s*)metricsBindAddress:.*$/\1metricsBindAddress: 0.0.0.0:10249/' \
            | kubectl apply -f -
          kubectl -n kube-system rollout restart ds/kube-proxy
          kubectl -n kube-system rollout status ds/kube-proxy --timeout=300s
          echo changed
        fi
      register: kp
      changed_when: "'changed' in kp.stdout"

# ------------------------------------------------------------------ 12. storage + helm
- name: Default StorageClass and Helm
  hosts: "{{ groups['k8s_masters'][0] }}"
  tags: [storage, monitoring]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Install local-path-provisioner
      ansible.builtin.command: >
        kubectl apply --server-side --force-conflicts
        -f https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ local_path_version }}/deploy/local-path-storage.yaml
      register: lp
      changed_when: "'unchanged' not in lp.stdout"

    - name: Make local-path the default StorageClass
      ansible.builtin.command: >
        kubectl patch storageclass local-path
        -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      changed_when: false

    - name: Wait for local-path-provisioner
      ansible.builtin.command: kubectl -n local-path-storage rollout status deploy/local-path-provisioner --timeout=180s
      changed_when: false

    - name: Check installed Helm version
      ansible.builtin.shell: helm version --short 2>/dev/null || true
      register: helm_cur
      changed_when: false

    - name: Install Helm {{ helm_version }}
      when: helm_version not in helm_cur.stdout
      block:
        - name: Download Helm (checksum verified)
          ansible.builtin.get_url:
            url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
            dest: /root/helm.tar.gz
            checksum: "sha256:{{ helm_sha256 }}"
            mode: "0644"

        - name: Unpack Helm binary
          ansible.builtin.unarchive:
            src: /root/helm.tar.gz
            dest: /usr/local/bin
            remote_src: true
            extra_opts: [--strip-components=1, linux-amd64/helm]
            mode: "0755"

# ------------------------------------------------------------------ 13. monitoring
- name: Prometheus + Grafana (kube-prometheus-stack)
  hosts: "{{ groups['k8s_masters'][0] }}"
  tags: [monitoring]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    grafana_admin_password: "{{ lookup('ansible.builtin.password', playbook_dir + '/artifacts/grafana-admin-password', length=24, chars=['ascii_letters', 'digits']) }}"
  tasks:
    - name: Namespace
      ansible.builtin.shell: kubectl create ns {{ monitoring_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Grafana admin secret (password kept in kubernetes/artifacts/, git-ignored)
      ansible.builtin.shell: |
        kubectl -n {{ monitoring_namespace }} create secret generic grafana-admin \
          --from-literal=admin-user=admin --from-literal=admin-password="$GF_PW" \
          --dry-run=client -o yaml | kubectl apply -f -
      environment:
        GF_PW: "{{ grafana_admin_password }}"
      no_log: true
      changed_when: false

    - name: Render chart values
      ansible.builtin.template:
        src: templates/kps-values.yaml.j2
        dest: /root/kps-values.yaml
        mode: "0600"

    - name: Helm repo
      ansible.builtin.shell: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update >/dev/null
        helm repo update prometheus-community >/dev/null
      changed_when: false

    - name: helm upgrade --install kube-prometheus-stack
      ansible.builtin.command: >
        helm upgrade --install kps prometheus-community/kube-prometheus-stack
        --namespace {{ monitoring_namespace }}
        --version {{ kps_chart_version }}
        --values /root/kps-values.yaml
        --wait --timeout 15m
      register: kps
      changed_when: true

    - name: Pods
      ansible.builtin.command: kubectl -n {{ monitoring_namespace }} get pods,svc,pvc -o wide
      register: mon
      changed_when: false

    - name: Show
      ansible.builtin.debug:
        var: mon.stdout_lines

# ------------------------------------------------------------------ 14. Mimir
- name: Grafana Mimir (long-term metrics, tenant infra)
  hosts: "{{ groups['k8s_masters'][0] }}"
  tags: [mimir]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    mimir_minio_password: "{{ lookup('ansible.builtin.password', playbook_dir + '/artifacts/mimir-minio-password', length=32, chars=['ascii_letters', 'digits']) }}"
  tasks:
    - name: Render chart values (contains the MinIO password)
      ansible.builtin.template:
        src: templates/mimir-values.yaml.j2
        dest: /root/mimir-values.yaml
        mode: "0600"
      no_log: true

    - name: Helm repo
      ansible.builtin.shell: |
        helm repo add grafana https://grafana.github.io/helm-charts --force-update >/dev/null
        helm repo update grafana >/dev/null
      changed_when: false

    - name: helm upgrade --install mimir
      ansible.builtin.command: >
        helm upgrade --install mimir grafana/mimir-distributed
        --namespace {{ mimir_namespace }} --create-namespace
        --version {{ mimir_chart_version }}
        --values /root/mimir-values.yaml
        --wait --timeout 20m
      changed_when: true

    - name: Mimir gateway ready
      ansible.builtin.command: kubectl -n {{ mimir_namespace }} run mimir-ready --rm -i --restart=Never --image=curlimages/curl:8.11.1 -- -fsS {{ mimir_gateway }}/ready
      changed_when: false
