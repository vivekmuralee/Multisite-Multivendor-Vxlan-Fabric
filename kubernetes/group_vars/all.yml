# Versions
k8s_minor: "1.37"            # apt repo channel on pkgs.k8s.io
k8s_version: "1.37.2"        # passed to kubeadm as kubernetesVersion
kube_vip_version: "v1.3.1"
calico_version: "v3.33.0"

# Control-plane VIP (kube-vip, ARP mode). Outside the libvirt DHCP range (.128-.240).
k8s_api_vip: 192.168.122.90
k8s_api_port: 6443

# Must not overlap 192.168.122.0/24 (Calico's default 192.168.0.0/16 does).
k8s_pod_cidr: 10.244.0.0/16
k8s_service_cidr: 10.96.0.0/12
k8s_cluster_name: kube-lab

k8s_first_master: "{{ groups['k8s_masters'][0] }}"

# MetalLB (L2 mode) for Services of type LoadBalancer.
# Outside libvirt DHCP (.128-.240), node IPs (.90-.97) and ubuntu-server (.100).
metallb_version: "v0.16.2"
metallb_pool_name: lab-pool
metallb_addresses:
  - 192.168.122.50-192.168.122.79

# Kubelet drop-in config dir (survives kubeadm upgrade, unlike /var/lib/kubelet/config.yaml)
kubelet_config_dir: /etc/kubernetes/kubelet.conf.d

# metrics-server (HA manifest: 2 replicas + PDB). Kubelets use CA-signed serving
# certs (serverTLSBootstrap), so metrics-server verifies them normally.
metrics_server_version: "v0.9.1"

# Grow the root LV into the free space Ubuntu's installer leaves in ubuntu-vg.
root_lv: /dev/ubuntu-vg/ubuntu-lv

# Default StorageClass (node-local hostPath volumes; data stays on the node that created it)
local_path_version: "v0.0.37"
local_path_dir: /opt/local-path-provisioner

# Helm (installed on the first master, checksum-verified)
helm_version: "v4.3.1"
helm_sha256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b

# Monitoring: kube-prometheus-stack (Prometheus Operator, Prometheus, Alertmanager,
# Grafana, node-exporter, kube-state-metrics). UIs exposed via MetalLB pinned IPs.
monitoring_namespace: monitoring
kps_chart_version: "93.2.2"
grafana_lb_ip: 192.168.122.60
prometheus_lb_ip: 192.168.122.61
alertmanager_lb_ip: 192.168.122.62
prometheus_retention: 15d
prometheus_retention_size: 18GB
prometheus_storage: 20Gi
alertmanager_storage: 2Gi
grafana_storage: 5Gi

# Grafana Mimir: long-term metrics store. Prometheus remote_writes everything to
# tenant "infra"; Grafana gets a "Mimir (infra)" data source.
mimir_namespace: mimir
mimir_chart_version: "6.2.2"          # Mimir 3.2.3
mimir_tenant: infra
mimir_retention: 30d
mimir_minio_storage: 25Gi
mimir_kafka_storage: 10Gi
mimir_ingester_storage: 10Gi
mimir_gateway: "http://mimir-gateway.{{ mimir_namespace }}.svc.cluster.local"
k8s_cluster_label: kube-lab

# SNMP exporter: polls the Cumulus fabric switches (SNMPv2c, read-only) and exposes
# the results to Prometheus (and, via remote_write, Mimir). The community string must
# match cumulus/group_vars/all/vars.yml (snmp_community); the switches only answer
# sources inside snmp_allowed_prefix (pods leave the node via SNAT, so node IPs match).
snmp_exporter_chart_version: "9.21.1"     # app v0.31.0
snmp_community: cl-fabric-ro
snmp_modules: [if_mib, system, ucd_la_table, ucd_memory, ucd_system_stats]   # interfaces, uptime, load, memory, CPU
snmp_scrape_interval: 30s
snmp_scrape_timeout: 20s
snmp_targets:
  - { name: cl-sp-1,    target: 192.168.122.32 }
  - { name: cl-sp-2,    target: 192.168.122.33 }
  - { name: cl-lf-1,    target: 192.168.122.34 }
  - { name: cl-lf-2,    target: 192.168.122.35 }
  - { name: cl-lf-3,    target: 192.168.122.36 }
  - { name: cl-lf-4,    target: 192.168.122.37 }
  - { name: cl-bl-lf-1, target: 192.168.122.38 }
  - { name: cl-bl-lf-2, target: 192.168.122.39 }

# JSON exporter: polls the NVUE REST API on each Cumulus switch (HTTPS :8765, read-only
# "monitor" user, nvue-monitor role) for BGP session state. SNMP cannot do this: the
# underlay uses BGP unnumbered and FRR's BGP4-MIB peer table only lists IPv4-addressed peers.
# Credentials must match cumulus/group_vars/all/vars.yml (nvue_api_*).
json_exporter_chart_version: "0.20.2"     # app v0.7.0
nvue_api_user: monitor
nvue_api_password: Fabric-Mon-ro1
bgp_scrape_interval: 30s
bgp_scrape_timeout: 20s
# vrf_modules: extra VRFs to poll (VRF-lite peers to the PEs live in TENANT_A on the border leafs)
bgp_targets:
  - { name: cl-sp-1,    ip: 192.168.122.32 }
  - { name: cl-sp-2,    ip: 192.168.122.33 }
  - { name: cl-lf-1,    ip: 192.168.122.34 }
  - { name: cl-lf-2,    ip: 192.168.122.35 }
  - { name: cl-lf-3,    ip: 192.168.122.36 }
  - { name: cl-lf-4,    ip: 192.168.122.37 }
  - { name: cl-bl-lf-1, ip: 192.168.122.38, tenant_a: true }
  - { name: cl-bl-lf-2, ip: 192.168.122.39, tenant_a: true }

# gnmic: streams gNMI telemetry from the Arista fabric (OpenConfig paths: interfaces, BGP/EVPN
# neighbors, CPU/memory) and exposes it as Prometheus metrics on :9804. Credentials must match
# arista/group_vars/all/vars.yml (gnmi_user / gnmi_hashed_password). Plain gRPC on the mgmt VRF.
gnmic_image: ghcr.io/openconfig/gnmic:0.49.1
gnmi_user: monitor
gnmi_password: Fabric-Mon-ro1
gnmi_sample_interval: 30s
gnmi_targets:
  - { name: arista-sp-1,    address: "192.168.122.24:6030" }
  - { name: arista-sp-2,    address: "192.168.122.25:6030" }
  - { name: arista-bl-lf-1, address: "192.168.122.26:6030" }
  - { name: arista-bl-lf-2, address: "192.168.122.27:6030" }
  - { name: arista-lf-1,    address: "192.168.122.28:6030" }
  - { name: arista-lf-2,    address: "192.168.122.29:6030" }
