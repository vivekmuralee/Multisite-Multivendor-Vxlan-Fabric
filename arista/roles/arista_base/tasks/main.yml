---
- name: Push base configuration - hostname, management
  arista.eos.eos_config:
    src: base.j2
    save_when: modified

# Own task + tag so NTP can be pushed on its own:
#   ansible-playbook site.yml --tags ntp
- name: Push NTP servers
  arista.eos.eos_config:
    src: ntp.j2
    save_when: modified
  tags: [ntp]
