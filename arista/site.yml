---
# Deploy a BGP EVPN VXLAN fabric across 2 spines, 2 leafs and 2 border
# leafs on Arista EOS. arista-bl-lf-1/arista-bl-lf-2 carry the full L2/L3
# EVPN overlay (they are in the leaf group too) and are the border gateways
# to the WAN once wan_uplinks is filled in.
#
# Usage:
#   ansible-playbook site.yml --check --diff         # preview, no changes
#   ansible-playbook site.yml
#   ansible-playbook site.yml --limit spine          # underlay only, spines
#   ansible-playbook site.yml --tags cleanup         # one-off stale-config removal

- name: Configure base - hostname, management, NTP (all fabric switches)
  hosts: fabric
  gather_facts: false
  roles:
    - arista_base

- name: Configure BGP underlay + EVPN control plane (all fabric switches)
  hosts: fabric
  gather_facts: false
  roles:
    - arista_underlay

- name: Configure VXLAN overlay - VLANs, VNIs, anycast gateways, VRF (leafs only)
  hosts: leaf
  gather_facts: false
  roles:
    - arista_overlay

- name: Configure border gateway - VRF-lite eBGP to the WAN (border leafs only)
  hosts: border_leaf
  gather_facts: false
  roles:
    - arista_border_leaf

# eos_config only adds lines, so config the templates no longer render has
# to be removed with explicit "no" commands (eos_cleanup_* in group_vars /
# host_vars). Tagged "never" - it only runs with --tags cleanup.
- name: Remove stale configuration (leafs only)
  hosts: leaf
  gather_facts: false
  tags: [never, cleanup]
  tasks:
    - name: Remove stale global configuration
      arista.eos.eos_config:
        lines: "{{ eos_cleanup_global }}"
        save_when: modified
      when: eos_cleanup_global | default([]) | length > 0

    - name: Remove stale BGP configuration
      arista.eos.eos_config:
        lines: "{{ eos_cleanup_bgp }}"
        parents: "router bgp {{ router_asn }}"
        save_when: modified
      when: eos_cleanup_bgp | default([]) | length > 0
