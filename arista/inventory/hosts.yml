---
# 2-Spine / 2-Leaf / 2-Border-Leaf Arista EOS BGP EVPN VXLAN fabric
# arista-bl-lf-1 and arista-bl-lf-2 are the border leafs: full L2 + L3 EVPN
# members of the fabric (numbered eBGP to both spines) that will also carry
# the VRF-lite WAN peering in vrf PROD.

all:
  children:
    spine:
      hosts:
        # TODO: spine management IPs were not in the captured configs -
        # confirm these before running against the spines.
        arista-sp-1:
          ansible_host: 192.168.122.24
        arista-sp-2:
          ansible_host: 192.168.122.25

    # border_leaf is a child of leaf, so the border leafs also get the
    # spine uplinks and the full VXLAN overlay (arista_overlay role) - the
    # arista_border_leaf role only adds the WAN side on top.
    leaf:
      hosts:
        arista-lf-1:
          ansible_host: 192.168.122.28
        arista-lf-2:
          ansible_host: 192.168.122.29
      children:
        border_leaf:

    border_leaf:
      hosts:
        arista-bl-lf-1:
          ansible_host: 192.168.122.26
        arista-bl-lf-2:
          ansible_host: 192.168.122.27

    fabric:
      children:
        spine:
        leaf:
