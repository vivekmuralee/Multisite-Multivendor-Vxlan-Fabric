---
# Deploy a BGP EVPN VXLAN fabric across 2 spines, 4 leafs and 2 border
# leafs on Cumulus Linux. cl-bl-lf-1/cl-bl-lf-2 carry the full L2/L3 EVPN
# overlay (they are in the leaf group too) and act as border gateways to the
# WAN/MPLS edge routers PE1 and PE2.
#
# Usage:
#   ansible-playbook site.yml
#   ansible-playbook site.yml --limit spine        # underlay only, spines
#   ansible-playbook site.yml --limit border_leaf   # re-push external peering

- name: Configure BGP underlay + EVPN control plane (all fabric switches)
  hosts: fabric
  gather_facts: false
  roles:
    - cumulus_underlay

- name: Configure VXLAN overlay - bridge, VNIs, anycast gateways, VRF (leafs only)
  hosts: leaf
  gather_facts: false
  roles:
    - cumulus_overlay

- name: Configure border gateway - VRF-lite eBGP to PE1/PE2 (border leafs only)
  hosts: border_leaf
  gather_facts: false
  roles:
    - cumulus_border_leaf
