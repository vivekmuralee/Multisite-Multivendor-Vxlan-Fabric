---
# ---------------------------------------------------------------------------
# Global fabric-wide variables
# ---------------------------------------------------------------------------

# SSH login + sudo/become password, sourced from the vault-encrypted
# vault_ansible_password in group_vars/all/vault.yml (never store the
# plaintext password here - this file is committed to git).
ansible_password: "{{ vault_ansible_password }}"
ansible_become_pass: "{{ vault_ansible_password }}"

fabric_mtu: 9216

# Tenant L2 VNIs stretched across every leaf. Every leaf configures the same
# SVI / anycast gateway for each VLAN (symmetric IRB, distributed anycast GW).
vni_mappings:
  - vlan: 10
    vni: 10010
    name: WEB
    subnet: 10.20.10.0/24
    anycast_gw_ip: 10.20.10.254/24
  - vlan: 20
    vni: 10020
    name: APP
    subnet: 10.20.20.0/24
    anycast_gw_ip: 10.20.20.254/24
  - vlan: 30
    vni: 10030
    name: DB
    subnet: 10.20.30.0/24
    anycast_gw_ip: 10.20.30.254/24

# Summary of every vni_mappings subnet - the only tenant prefix the border
# leafs advertise to the WAN PEs. Keep new tenant subnets inside it.
tenant_summary: 10.20.0.0/16

# L3 VNI used for symmetric IRB / inter-subnet routing within the tenant VRF.
l3vni:
  vlan: 100
  vni: 10100
  vrf: TENANT_A

# Shared anycast gateway MAC used on every leaf for every tenant SVI.
anycast_gw_mac: "44:38:39:ff:00:01"

# EVPN / underlay behaviour
evpn_advertise_all_vni: true
bgp_ecmp: 2

# SNMPv2c read-only polling by the Prometheus SNMP exporter on the Kubernetes
# cluster (kubernetes/, tag "snmp"). Keep snmp_community in sync with
# kubernetes/group_vars/all.yml. Lab-grade: a v2c community is a shared secret
# sent in clear text, so it is restricted to snmp_allowed_prefix (the GNS3
# management / libvirt network the exporter's node IPs live in) and is read-only.
snmp_community: cl-fabric-ro
snmp_allowed_prefix: 192.168.122.0/24
snmp_location: "GNS3 lab - Multisite VXLAN fabric"

# NVUE REST API (HTTPS :8765, read-only "monitor" user). The Prometheus JSON exporter polls
# it for BGP session state - SNMP cannot, because BGP unnumbered peers are not in the
# BGP4-MIB peer table. Hash = SHA-512 (openssl passwd -6) of kubernetes/group_vars/all.yml
# nvue_api_password; lab-grade, vault it for anything real.
nvue_api_user: monitor
nvue_api_hashed_password: "$6$fabricmon$ZBPcdnLwQSzXlIb8BajMVLICU2Yf4D0ZZg1kHYiCSMt8O4dUjBZMruZlf4EW2p8FyadbWuJDJ9tI1HvIwNj0p/"

