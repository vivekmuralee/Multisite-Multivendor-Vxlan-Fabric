---
device_role: border_leaf
border_leaf: true

# WAN / MPLS edge routers (the Cisco IOS backbone PEs from the top-level
# README's Phase-2/Phase-3 work). Every border leaf is cabled to both PEs
# (full mesh, see wan_uplinks in host_vars/cl-bl-lf-*.yml) and runs a
# numbered eBGP session to each one inside the tenant VRF (VRF-lite) - the
# PEs are outside the fabric's unnumbered underlay domain.
wan_pe_routers:
  PE1:
    asn: 65101
  PE2:
    asn: 65102

# MTU on the PE-facing links. Jumbo, same as the fabric, so the WAN can
# carry full-size frames between the Cumulus and Arista sites (multi-site
# fabric). The PE interfaces must be set to the same MTU - a mismatch lets
# BGP come up but silently drops large packets.
wan_mtu: "{{ fabric_mtu }}"
