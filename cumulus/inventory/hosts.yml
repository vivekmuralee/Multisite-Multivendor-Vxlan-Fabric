---
# 2-Spine / 6-Leaf Cumulus Linux BGP EVPN VXLAN fabric
# leaf05 and leaf06 are the external / border leafs (VRF route-leaking to the WAN/MPLS edge)

all:
  children:
    spine:
      hosts:
        spine1:
          ansible_host: 192.168.0.11
        spine2:
          ansible_host: 192.168.0.12

    leaf:
      hosts:
        leaf01:
          ansible_host: 192.168.0.21
        leaf02:
          ansible_host: 192.168.0.22
        leaf03:
          ansible_host: 192.168.0.23
        leaf04:
          ansible_host: 192.168.0.24
        leaf05:
          ansible_host: 192.168.0.25
        leaf06:
          ansible_host: 192.168.0.26

    border_leaf:
      hosts:
        leaf05:
        leaf06:

    fabric:
      children:
        spine:
        leaf:
