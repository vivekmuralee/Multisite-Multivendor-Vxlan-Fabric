---
# 2-Spine / 4-Leaf / 2-Border-Leaf Cumulus Linux BGP EVPN VXLAN fabric
# cl-bl-lf-1 and cl-bl-lf-2 are the border leafs / border gateways: full
# L2 + L3 EVPN members of the fabric (eBGP unnumbered to both spines) and
# VRF-lite eBGP gateways to the WAN/MPLS edge routers PE1 and PE2.

all:
  children:
    spine:
      hosts:
        cl-sp-1:
          ansible_host: 192.168.122.32
        cl-sp-2:
          ansible_host: 192.168.122.33

    # border_leaf is a child of leaf, so the border leafs also get the
    # spine uplinks (group_vars/leaf.yml) and the full VXLAN overlay
    # (cumulus_overlay role) - the cumulus_border_leaf role only adds the
    # WAN side on top.
    leaf:
      hosts:
        cl-lf-1:
          ansible_host: 192.168.122.34
        cl-lf-2:
          ansible_host: 192.168.122.35
        cl-lf-3:
          ansible_host: 192.168.122.36
        cl-lf-4:
          ansible_host: 192.168.122.37
      children:
        border_leaf:

    border_leaf:
      hosts:
        cl-bl-lf-1:
          ansible_host: 192.168.122.38
        cl-bl-lf-2:
          ansible_host: 192.168.122.39

    fabric:
      children:
        spine:
        leaf:
