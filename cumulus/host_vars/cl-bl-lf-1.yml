---
router_asn: 65015
loopback_ip: 10.0.0.15/32
vtep_ip: 10.0.0.15

# Border-gateway uplinks: one numbered /30 to each WAN/MPLS PE router
# (PE ASNs live in wan_pe_routers, group_vars/border_leaf.yml)
wan_uplinks:
  - interface: swp3
    pe: PE1
    description: "cl-bl-lf-1 -> PE1 (WAN/MPLS edge)"
    local_ip: 192.168.100.1/30
    peer_ip: 192.168.100.2
  - interface: swp4
    pe: PE2
    description: "cl-bl-lf-1 -> PE2 (WAN/MPLS edge)"
    local_ip: 192.168.100.5/30
    peer_ip: 192.168.100.6
