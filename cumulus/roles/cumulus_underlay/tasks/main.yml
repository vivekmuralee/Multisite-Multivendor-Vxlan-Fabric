---
# NVUE owns /etc/network/interfaces, /etc/frr/daemons and /etc/frr/frr.conf
# on this platform (Cumulus Linux 5.x) - editing those files directly (the
# old ifupdown2/frr.conf approach) fights NVUE's own reconciliation and gets
# silently reverted. So config is delivered as "nv set" commands staged into
# NVUE's pending revision, committed with a single "nv config apply". This
# also means no separate FRR-daemon-enable or restart-frr step is needed:
# NVUE (re)generates frr.conf/daemons and restarts what it needs to as part
# of "nv config apply" itself.
- name: Render NVUE underlay/EVPN-transit command set
  ansible.builtin.template:
    src: nv_underlay.sh.j2
    dest: /tmp/ansible-nvue-underlay.sh
    mode: "0755"

- name: Stage NVUE underlay/EVPN-transit configuration
  ansible.builtin.command: bash /tmp/ansible-nvue-underlay.sh
  changed_when: true

- name: Remove rendered NVUE command script
  ansible.builtin.file:
    path: /tmp/ansible-nvue-underlay.sh
    state: absent

- name: Check for pending NVUE configuration changes
  ansible.builtin.command: nv config diff
  register: cumulus_underlay_nvue_diff
  changed_when: false

- name: Apply pending NVUE configuration
  ansible.builtin.command: nv config apply -y
  when: cumulus_underlay_nvue_diff.stdout | trim | length > 0
  changed_when: true
